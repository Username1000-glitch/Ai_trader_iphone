<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#080d18">

<title>AI Trader</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#080d18;color:#eef3ff;font-family:Arial,sans-serif;padding:20px}

header{display:flex;justify-content:space-between;align-items:center}

h1{font-size:25px;margin:10px 0}

.green{color:#36d69a}

.muted{color:#8995aa}

.card{background:#121c2d;border:1px solid #26354b;border-radius:15px;padding:17px;margin:17px 0}

.balance{font-size:34px;font-weight:bold;margin:12px 0}

button{background:#2878ef;color:white;border:0;padding:12px 17px;border-radius:9px;font-weight:bold}

input{background:#080d18;color:white;border:1px solid #34435b;padding:12px;border-radius:8px;width:100%;margin:8px 0}

.stock{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #29364a}

.stock:last-child{border:0}

.stock small{display:block;color:#8995aa;margin-top:5px}

h2{font-size:18px}

.actions{display:flex;gap:8px}

.actions button{flex:1}

.red{color:#ff7272}

footer{text-align:center;color:#78859a;font-size:12px;padding:20px}
